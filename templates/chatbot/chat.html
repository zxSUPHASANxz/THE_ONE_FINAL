{% extends 'base.html' %}
{% load static %}

{% block title %}AI Chatbot - THE ONE{% endblock %}

{% block extra_css %}
<style>
    .chat-page {
        min-height: calc(100vh - 120px);
    }

    .chat-container {
        height: calc(100vh - 290px);
        min-height: 420px;
    }
    
    .message-bubble {
        max-width: 78%;
        word-wrap: break-word;
    }
    
    @keyframes slideUp {
        from {
            opacity: 0;
            transform: translateY(10px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    
    .message-enter {
        animation: slideUp 0.3s ease-out;
    }
</style>
{% endblock %}

{% block content %}
<div class="chat-page bg-gray-100 -mx-4 sm:-mx-6 lg:-mx-8 px-4 sm:px-6 lg:px-8 py-4 sm:py-6">
    <div class="max-w-5xl mx-auto h-full flex flex-col">
        <div class="bg-transparent rounded-2xl overflow-hidden flex-1 flex flex-col">
            <div class="chat-container overflow-y-auto px-0 py-6 flex flex-col justify-end gap-4" id="chatMessages">
                <!-- Welcome Message -->
                <div class="flex justify-center items-center message-enter mt-auto mb-auto" id="welcomeMessage">
                    <div class="flex flex-col items-center text-center px-4">
                        <img src="{% static 'images/the_one_logo.png' %}" alt="THE_ONE Logo" class="w-20 h-20 sm:w-24 sm:h-24 object-contain mb-4" />
                        <p class="text-gray-700 text-base sm:text-lg font-medium max-w-xl">
                            THE_ONE Ai อัฉริยะที่จะช่วยให้คำแนะนำปรึกษาเบื้องต้นเกี่ยวกับรถจักรยานยนต์
                        </p>
                    </div>
                </div>

                <!-- User Message Example (Hidden by default) -->
                <div class="flex justify-end message-enter" style="display: none;" data-template="user">
                    <div class="message-bubble bg-gray-200 border border-gray-300 text-gray-900 rounded-2xl rounded-br-md px-5 py-3 shadow-sm">
                        <p class="message-text"></p>
                    </div>
                </div>

                <!-- Bot Message Example (Hidden by default) -->
                <div class="flex justify-start message-enter" style="display: none;" data-template="bot">
                    <div class="message-bubble bg-white border border-gray-200 text-gray-800 rounded-2xl rounded-tl-md px-5 py-4 shadow-sm">
                        <div class="flex items-start space-x-3">
                            <img src="{% static 'images/the_one_logo.png' %}" alt="THE_ONE Logo" class="w-7 h-7 object-contain mt-0.5" />
                            <div class="message-text"></div>
                        </div>
                    </div>
                </div>

                <!-- Typing Indicator (Hidden by default) -->
                <div class="flex justify-start" id="typingIndicator" style="display: none;">
                    <div class="message-bubble bg-white border border-gray-200 text-gray-800 rounded-2xl rounded-tl-md px-5 py-4 shadow-sm">
                        <div class="flex items-center space-x-3">
                            <img src="{% static 'images/the_one_logo.png' %}" alt="THE_ONE Logo" class="w-7 h-7 object-contain" />
                            <div class="flex space-x-2">
                                <div class="w-2 h-2 bg-purple-400 rounded-full animate-bounce" style="animation-delay: 0s;"></div>
                                <div class="w-2 h-2 bg-purple-400 rounded-full animate-bounce" style="animation-delay: 0.2s;"></div>
                                <div class="w-2 h-2 bg-purple-400 rounded-full animate-bounce" style="animation-delay: 0.4s;"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="px-0 pt-3 pb-2">
                <form id="chatForm" class="max-w-3xl mx-auto flex items-center gap-3 bg-white border border-gray-300 rounded-3xl px-4 py-3 shadow-sm">
                    <input 
                        type="text" 
                        id="messageInput"
                        placeholder="พิมพ์คำถามของคุณที่นี่..."
                        class="flex-1 appearance-none bg-transparent text-gray-900 placeholder-gray-500 focus:outline-none"
                        autocomplete="off">
                    <button 
                        type="submit"
                        class="bg-black hover:bg-gray-900 text-white w-9 h-9 rounded-full font-semibold transition-colors duration-200 flex items-center justify-center">
                        ↑
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const chatMessages = document.getElementById('chatMessages');
    const chatForm = document.getElementById('chatForm');
    const messageInput = document.getElementById('messageInput');
    const typingIndicator = document.getElementById('typingIndicator');
    const welcomeMessage = document.getElementById('welcomeMessage');

    function hideWelcomeMessage() {
        if (welcomeMessage && welcomeMessage.style.display !== 'none') {
            welcomeMessage.style.display = 'none';
        }
    }

    // Auto-scroll to bottom
    function scrollToBottom() {
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    // Add user message
    function addUserMessage(text) {
        hideWelcomeMessage();
        const template = document.querySelector('[data-template="user"]');
        const messageDiv = template.cloneNode(true);
        messageDiv.style.display = 'flex';
        messageDiv.removeAttribute('data-template');
        messageDiv.querySelector('.message-text').textContent = text;
        chatMessages.appendChild(messageDiv);
        scrollToBottom();
    }

    // Add bot message
    function addBotMessage(text) {
        hideWelcomeMessage();
        const template = document.querySelector('[data-template="bot"]');
        const messageDiv = template.cloneNode(true);
        messageDiv.style.display = 'flex';
        messageDiv.removeAttribute('data-template');
        messageDiv.querySelector('.message-text').innerHTML = text;
        chatMessages.appendChild(messageDiv);
        scrollToBottom();
    }

    // Show/hide typing indicator
    function setTyping(show) {
        if (show) {
            chatMessages.appendChild(typingIndicator);
            typingIndicator.style.display = 'flex';
            scrollToBottom();
            return;
        }

        typingIndicator.style.display = 'none';
    }

    // Send message to backend
    let isSending = false;  // Prevent duplicate sends
    
    async function sendMessage(message) {
        // Prevent duplicate sends
        if (isSending) {
            console.log('Already sending a message, please wait...');
            return;
        }
        
        isSending = true;
        addUserMessage(message);
        messageInput.value = '';
        messageInput.disabled = true;  // Disable input while sending
        setTyping(true);

        try {
            const response = await fetch('/chatbot/api/chat/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                credentials: 'same-origin',
                body: JSON.stringify({ message: message })
            });

            const data = await response.json();
            setTyping(false);
            isSending = false;  // Re-enable sending
            messageInput.disabled = false;  // Re-enable input

            if (data.response) {
                addBotMessage(data.response);
            } else {
                addBotMessage('ขออภัยครับ เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง');
            }
        } catch (error) {
            console.error('Chat error:', error);
            setTyping(false);
            isSending = false;  // Re-enable sending on error
            messageInput.disabled = false;  // Re-enable input
            addBotMessage('ขออภัยครับ ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้ กรุณาลองใหม่ภายหลัง');
        }
    }

    // Helper: Get CSRF token
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    // Form submit handler
    chatForm.addEventListener('submit', function(e) {
        e.preventDefault();
        const message = messageInput.value.trim();
        if (message && !isSending) {  // Check if not already sending
            sendMessage(message);
        }
    });

    // Focus input on load
    scrollToBottom();
    messageInput.focus();
});
</script>
{% endblock %}
{% endblock %}
