<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <style>
    .actor { font: 16px/1.2 'Arial', sans-serif; fill: #111; }
    .actor-box { fill: #f3f4f6; stroke: #374151; stroke-width:2; rx:6; }
    .usecase { fill: #ffffff; stroke: #1f2937; stroke-width:2; }
    .uc-text { font: 14px/1.2 'Arial', sans-serif; fill: #111; text-anchor:middle; }
    .line { stroke: #374151; stroke-width:2; }
    .title { font: 20px/1.2 'Arial', sans-serif; fill:#0f172a; font-weight:700; }
  </style>

  <rect x="10" y="10" width="1380" height="60" rx="6" fill="#eef2ff" stroke="#c7d2fe" stroke-width="2"/>
  <text x="20" y="48" class="title">Use Case Diagram — THE_ONE (สรุปฟังก์ชันหลัก)</text>

  <!-- Actors (left) -->
  <g transform="translate(30,110)">
    <rect class="actor-box" x="0" y="0" width="180" height="60"/>
    <text class="actor" x="90" y="22" text-anchor="middle">ผู้ใช้ทั่วไป</text>
    <text class="actor" x="90" y="44" text-anchor="middle">(Customer)</text>
  </g>

  <g transform="translate(30,220)">
    <rect class="actor-box" x="0" y="0" width="180" height="60"/>
    <text class="actor" x="90" y="22" text-anchor="middle">ช่างซ่อม</text>
    <text class="actor" x="90" y="44" text-anchor="middle">(Mechanic)</text>
  </g>

  <!-- Actors (right) -->
  <g transform="translate(1190,110)">
    <rect class="actor-box" x="0" y="0" width="180" height="60"/>
    <text class="actor" x="90" y="22" text-anchor="middle">ระบบ/ผู้ดูแล</text>
    <text class="actor" x="90" y="44" text-anchor="middle">(Admin/System)</text>
  </g>

  <!-- Use case ovals (center) -->
  <!-- Account -->
  <ellipse class="usecase" cx="420" cy="140" rx="160" ry="36" fill="#fff"/>
  <text class="uc-text" x="420" y="145">สมัครสมาชิก / ลงชื่อเข้าใช้</text>

  <ellipse class="usecase" cx="420" cy="210" rx="140" ry="34"/>
  <text class="uc-text" x="420" y="215">อ่านคู่มือ / ตั้งค่าบัญชี</text>

  <!-- Booking -->
  <ellipse class="usecase" cx="750" cy="120" rx="180" ry="36"/>
  <text class="uc-text" x="750" y="125">สร้างการจอง (Create Booking)</text>

  <ellipse class="usecase" cx="750" cy="190" rx="160" ry="34"/>
  <text class="uc-text" x="750" y="195">ยกเลิกการจอง (Cancel Booking)</text>

  <ellipse class="usecase" cx="750" cy="260" rx="150" ry="34"/>
  <text class="uc-text" x="750" y="265">ดูสถานะการจอง</text>

  <!-- Mechanic actions -->
  <ellipse class="usecase" cx="420" cy="340" rx="180" ry="36"/>
  <text class="uc-text" x="420" y="345">ดูคิวงาน / รับงาน / ปฏิเสธ</text>

  <ellipse class="usecase" cx="750" cy="340" rx="160" ry="36"/>
  <text class="uc-text" x="750" y="345">เริ่มงาน / ทำงานเสร็จ</text>

  <ellipse class="usecase" cx="420" cy="420" rx="140" ry="34"/>
  <text class="uc-text" x="420" y="425">ยกเลิกโดยช่าง</text>

  <!-- Chat & Search -->
  <ellipse class="usecase" cx="1050" cy="220" rx="150" ry="34"/>
  <text class="uc-text" x="1050" y="225">แชทระหว่างลูกค้า-ช่าง</text>

  <ellipse class="usecase" cx="1050" cy="320" rx="150" ry="34"/>
  <text class="uc-text" x="1050" y="325">ค้นหาช่างใกล้เคียง</text>

  <!-- Notifications -->
  <ellipse class="usecase" cx="750" cy="440" rx="160" ry="34"/>
  <text class="uc-text" x="750" y="445">แจ้งเตือน (push / in-app)</text>

  <!-- Lines from Customer to use cases -->
  <line class="line" x1="210" y1="140" x2="260" y2="140"/>
  <line class="line" x1="210" y1="210" x2="320" y2="210"/>
  <line class="line" x1="210" y1="140" x2="630" y2="120"/>
  <line class="line" x1="210" y1="140" x2="630" y2="190"/>
  <line class="line" x1="210" y1="140" x2="1010" y2="220"/>
  <line class="line" x1="210" y1="140" x2="1010" y2="320"/>

  <!-- Lines from Mechanic to use cases -->
  <line class="line" x1="210" y1="280" x2="530" y2="340"/>
  <line class="line" x1="210" y1="280" x2="730" y2="340"/>
  <line class="line" x1="210" y1="280" x2="530" y2="420"/>
  <line class="line" x1="210" y1="280" x2="730" y2="120" stroke-dasharray="6,4"/>

  <!-- Lines from Admin/System -->
  <line class="line" x1="1190" y1="190" x2="900" y2="120" stroke-dasharray="4,4"/>
  <line class="line" x1="1190" y1="190" x2="900" y2="190" stroke-dasharray="4,4"/>
  <line class="line" x1="1190" y1="190" x2="900" y2="440" stroke-dasharray="4,4"/>

  <!-- Legend -->
  <rect x="20" y="780" width="420" height="100" rx="8" fill="#fff8e6" stroke="#f59e0b"/>
  <text x="40" y="808" font-size="14" fill="#92400e">Legend:</text>
  <text x="40" y="830" font-size="13" fill="#374151">- เส้นทึบ = กิจกรรมหลัก</text>
  <text x="40" y="850" font-size="13" fill="#374151">- เส้นประ = การเชื่อมโยงเชิงระบบ / ข้อกำหนดเพิ่มเติม</text>

</svg>
